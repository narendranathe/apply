name: Migration verification
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Install isolated PDF build tools
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends texlive-latex-extra texlive-fonts-recommended poppler-utils
      - run: python scripts/security_check.py
      - run: python -m unittest discover -s tests -v
        env:
          MIGRATION_BACKUP_KEY: ${{ github.event_name == 'push' && secrets.MIGRATION_BACKUP_KEY || '' }}
      - run: python -m unittest discover -s cloud/legacy/work -q
      - name: Restore real encrypted history on hosted runner
        if: github.event_name == 'push'
        env:
          MIGRATION_BACKUP_KEY: ${{ secrets.MIGRATION_BACKUP_KEY }}
        run: python scripts/verify_migration_archive.py
      - run: python -m compileall -q cloud scripts
      - name: Schedule and single writer validation
        run: python scripts/check_workflows.py
      - name: Encrypted private build diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: encrypted-master-qa-${{ github.run_id }}
          path: run-output/master-qa.aesgcm
          retention-days: 7
          if-no-files-found: ignore
