name: Private history reconciliation
run-name: 'history:${{ inputs.mode }}'
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        default: dry-run
        options: [dry-run, import, inspect, snapshot, verify, readiness, activate, reconcile-startup, reconcile-scheduled, reconcile-index, reconcile-readback]
      offset:
        type: string
        default: '0'
      limit:
        type: string
        default: '100'
permissions:
  contents: read
  actions: read
concurrency:
  group: hiring-outreach-single-writer
  cancel-in-progress: false
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Authenticate and verify historic snapshot
        env:
          MIGRATION_BACKUP_KEY: ${{ secrets.MIGRATION_BACKUP_KEY }}
        run: python scripts/verify_migration_archive.py
      - name: Restore only to private ephemeral staging
        env:
          MIGRATION_BACKUP_KEY: ${{ secrets.MIGRATION_BACKUP_KEY }}
        run: |
          python - <<'PY'
          import base64, os
          from pathlib import Path
          from scripts.verify_migration_archive import restore_all
          root = Path('.migration-private')
          root.mkdir(mode=0o700, exist_ok=True)
          key = Path('/tmp/apply-runner-recovery-key.bin')
          try:
              fd = os.open(key, os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600)
              with os.fdopen(fd, 'wb') as stream:
                  stream.write(base64.b64decode(os.environ['MIGRATION_BACKUP_KEY'], validate=True))
              restore_all(root / 'restored', key)
          finally:
              key.unlink(missing_ok=True)
          PY
      - name: Reconcile without replaying historical effects
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          MIGRATION_BACKUP_KEY: ${{ secrets.MIGRATION_BACKUP_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          IMPORT_MODE: ${{ inputs.mode }}
          IMPORT_OFFSET: ${{ inputs.offset || '0' }}
          IMPORT_LIMIT: ${{ inputs.limit || '100' }}
          CLOUD_ENABLED: ${{ vars.CLOUD_ENABLED }}
        run: |
          if [ "$IMPORT_MODE" = 'reconcile-startup' ]; then
            python scripts/reconcile_startup.py
          elif [ "$IMPORT_MODE" = 'reconcile-scheduled' ]; then
            python scripts/reconcile_scheduled.py
          elif [ "$IMPORT_MODE" = 'reconcile-index' ]; then
            python scripts/reconcile_index.py
          elif [ "$IMPORT_MODE" = 'reconcile-readback' ]; then
            python scripts/reconcile_readback.py
          elif [ "$IMPORT_MODE" = 'activate' ]; then
            python scripts/activate_cloud.py
          elif [ "$IMPORT_MODE" = 'inspect' ]; then
            python scripts/inspect_cloud_readback.py .migration-private/restored/combined-historical-records.json
          elif [ "$IMPORT_MODE" = 'import' ]; then
            python scripts/migrate_history.py --input .migration-private/restored/combined-historical-records.json --write --private-destination-verified --offset "$IMPORT_OFFSET" --limit "$IMPORT_LIMIT"
          elif [ "$IMPORT_MODE" = 'snapshot' ] || [ "$IMPORT_MODE" = 'verify' ] || [ "$IMPORT_MODE" = 'readiness' ]; then
            python scripts/cloud_maintenance.py --input .migration-private/restored/combined-historical-records.json --mode "$IMPORT_MODE"
          else
            python scripts/migrate_history.py --input .migration-private/restored/combined-historical-records.json --offset "$IMPORT_OFFSET" --limit "$IMPORT_LIMIT"
          fi
      - name: Encrypted source snapshot and aggregate evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: reconciliation-evidence-${{ github.run_id }}
          path: |
            run-output/*.aesgcm
            run-output/maintenance-summary.json
          retention-days: 14
          if-no-files-found: ignore
      - name: Remove plaintext staging
        if: always()
        run: python -c "import shutil; from pathlib import Path; shutil.rmtree('.migration-private', ignore_errors=True); Path('/tmp/apply-runner-recovery-key.bin').unlink(missing_ok=True)"
