name: Agent proposal intake
on:
  workflow_dispatch:
    inputs:
      envelope_ciphertext:
        description: 'Public-key sealed proposal; never plaintext or credentials'
        type: string
        required: true
permissions:
  contents: read
  actions: read
concurrency:
  group: hiring-outreach-single-writer
  cancel-in-progress: false
jobs:
  intake:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Revalidate and acknowledge through the single writer
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          AGENT_INTAKE_CIPHERTEXT: ${{ inputs.envelope_ciphertext }}
          AGENT_INTAKE_PRIVATE_KEY: ${{ secrets.AGENT_INTAKE_PRIVATE_KEY }}
        run: python scripts/agent_intake.py
